name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Unit and geometry tests
        run: nix develop -c zig build test --summary all
      - name: Golden-image palette check
        run: nix develop -c nu tools/golden_check.nu
