name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      # Cold runners otherwise rebuild zig (no substituter serves
      # silversquirl/zig-flake) and the whole toolchain every run.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Ubuntu runners lack NixOS's /run/opengl-driver, where the nixpkgs GL
      # stack (glvnd vendor libs, gbm, DRI drivers) resolves software GL.
      # Without it Xvfb advertises no GLX and the golden check segfaults.
      # Verified against the same failure reproduced in a mount namespace.
      - name: Provide /run/opengl-driver (software GLX for Xvfb)
        run: |
          MESA=$(nix build --no-link --print-out-paths nixpkgs#mesa | tail -1)
          sudo ln -sfn "$MESA" /run/opengl-driver
      - name: Unit and geometry tests
        run: nix develop .#ci -c zig build test --summary all
      - name: Golden-image palette check
        run: nix develop .#ci -c nu tools/golden_check.nu
